            // 修复：计算两个日期的天数差（忽略时分秒，只算自然日）
            function getDaysDiff(date1, date2) {
                const d1 = new Date(date1.getFullYear(), date1.getMonth(), date1.getDate());
                const d2 = new Date(date2.getFullYear(), date2.getMonth(), date2.getDate());
                const oneDayMs = 24 * 60 * 60 * 1000;
                return Math.floor(Math.abs(d1 - d2) / oneDayMs);
            }

            // 获取指定年月第N个工作日的日期
            function getNthWorkday(year, month, n) {
                let count = 0;
                let date = 1;
                let currentDate = new Date(year, month, date);
                
                // 找到当月第一天
                while (count < n) {
                    currentDate = new Date(year, month, date);
                    const dayOfWeek = currentDate.getDay();
                    
                    // 判断是否为工作日（周一到周五）
                    if (dayOfWeek >= 1 && dayOfWeek <= 5) {
                        count++;
                        if (count === n) {
                            return currentDate;
                        }
                    }
                    date++;
                }
                
                return currentDate;
            }

            // 获取本月第7个工作日（发薪日）
            function getSalaryDate(year, month) {
                return getNthWorkday(year, month, 7);
            }

                    let nextYear = currentYear;
                    
                    if (nextMonth > 11) {
                        nextMonth = 0;
                        nextYear++;
                    }
                    
                    const nextSalaryDate = getSalaryDate(nextYear, nextMonth);
                    const daysToNextSalary = getDaysDiff(todayDateObj, nextSalaryDate);

                    countEl.innerText = daysToNextSalary;

                    // 所有节日名称都显示完整的"2026年xx"
                    const displayName = festival.name;
                    // 已过节日文案专用：去掉年份的短名称
                    const shortName = festival.name.replace("2026年", "");

                    let daysText = "";
                    let statusClass = "";

                    // 未到节日：显示"还有xx天"
                    if (festivalDate > todayDate) {
                        const daysLeft = getDaysDiff(today, festivalDate);
                        daysText = `还有 ${daysLeft} 天`;
                        statusClass = "not-yet";
                    } 
                    // 当天节日：显示"今天是xx！祝你开心🎇" 完全不变
                    else if (festivalDate.toDateString() === todayDate.toDateString()) {
                        daysText = `今天是${shortName}！祝你开心🎇`;
                        statusClass = "today";
                    } 
                    // 已过节日：显示"xx已过，开心最重要啦" 完全不变
                    else {
                        daysText = `${shortName}已过，开心最重要啦`;
                        statusClass = "passed";
                    }

                    const listItem = document.createElement('li');
                    listItem.innerHTML = `
                        <span class="name">${festival.emoji} ${displayName}</span>
                        <span class="days ${statusClass}">${daysText}</span>
                    `;
                    listContainer.appendChild(listItem);
                });
            }

            // 执行所有渲染函数
            renderCurrentDate();
            renderWeekendTip();
            renderMonthEndTip();
            renderSalaryTip();
            renderFestivals();
            showHappyQuote();
        }
    </script>
</body>
</html>
